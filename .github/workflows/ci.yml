name: CI

on:
  push:
    branches: ["main", "feat/**", "fix/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Test (Python 3.14)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.14
          allow-prereleases: true

      - name: Install dependencies
        run: pip install -e ".[test,lint,griffe]"

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Type-check (mypy)
        run: mypy src/

      - name: Test with coverage
        run: PYTHONPATH=src pytest --cov=src --cov-report=term-missing --cov-fail-under=100
